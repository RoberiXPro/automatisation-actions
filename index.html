<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automatisation des Actions par Heure</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to right, #62b5ad, #104f73);
            color: #fff;
            padding: 20px;
            margin: 0;
        }

        h1, h2 {
            text-align: center;
        }

        .container {
            background-color: #204f73;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.1);
            max-width: 800px;
            margin: 20px auto;
        }

        .form-group {
            margin-bottom: 10px;
        }

        label {
            font-weight: bold;
        }

        select, input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 5px;
            border-radius: 4px;
            border: none;
        }

        button {
            text-align: center;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 10px;
            border-radius: 4px;
        }

        button:hover {
            background-color: #0056b3;
        }

        textarea {
            resize: none;
            height: auto;
            min-height: 100px;
        }

        footer {
            text-align: center;
            margin-top: 20px;
            padding: 10px;
            font-size: 14px;
            color: #dedede;
        }
    </style>
</head>
<body>

<!-- ===================================================== -->
<!-- 1. AUTOMATISATION DES ACTIONS PAR HEURE (JS SIMPLE)   -->
<!-- ===================================================== -->
<div class="container">
    <h1>Automatisation des Actions par Heure</h1>
    
    <div class="form-group">
        <label for="actionType">Choisir l'action :</label>
        <select id="actionType">
            <option value="simple">Simple Action</option>
            <option value="double">Double Action</option>
            <option value="triple">Triple Action</option>
        </select>
    </div>

    <!-- Premier bouton -->
    <div id="buttonSelection" class="form-group">
        <label for="firstButton">Choisir premier bouton :</label>
        <select id="firstButton">
            <option value="finProdBtn">Fin de production (#finProdBtn)</option>
            <option value="PauseToggleBtn">Bouton Pause (#PauseToggleBtn)</option>
            <option value="playreelbutton">Bouton Play (tâche planifiée)</option>
        </select>
    </div>

    <div class="form-group" id="firstPlanningIdGroup" style="display:none;">
        <label for="firstPlanningId">ID de la tâche (data-planning-id) - 1er bouton :</label>
        <input type="text" id="firstPlanningId" placeholder="Ex : 440475">
    </div>

    <div class="form-group">
        <label for="firstButtonTime">Heure exacte pour le premier bouton (HH:MM:SS) :</label>
        <input type="time" id="firstButtonTime" step="1">
    </div>

    <!-- Deuxième bouton -->
    <div id="secondButtonSelection" class="form-group" style="display:none;">
        <label for="secondButton">Choisir deuxième bouton :</label>
        <select id="secondButton">
            <option value="finProdBtn">Fin de production (#finProdBtn)</option>
            <option value="PauseToggleBtn">Bouton Pause (#PauseToggleBtn)</option>
            <option value="playreelbutton">Bouton Play (tâche planifiée)</option>
        </select>
    </div>

    <div class="form-group" id="secondPlanningIdGroup" style="display:none;">
        <label for="secondPlanningId">ID de la tâche (data-planning-id) - 2e bouton :</label>
        <input type="text" id="secondPlanningId" placeholder="Ex : 440476">
    </div>

    <div id="secondButtonTimeSelection" class="form-group" style="display:none;">
        <label for="secondButtonTime">Heure exacte pour le deuxième bouton (HH:MM:SS) :</label>
        <input type="time" id="secondButtonTime" step="1">
    </div>

    <!-- Troisième bouton -->
    <div id="thirdButtonSelection" class="form-group" style="display:none;">
        <label for="thirdButton">Choisir troisième bouton :</label>
        <select id="thirdButton">
            <option value="finProdBtn">Fin de production (#finProdBtn)</option>
            <option value="PauseToggleBtn">Bouton Pause (#PauseToggleBtn)</option>
            <option value="playreelbutton">Bouton Play (tâche planifiée)</option>
        </select>
    </div>

    <div class="form-group" id="thirdPlanningIdGroup" style="display:none;">
        <label for="thirdPlanningId">ID de la tâche (data-planning-id) - 3e bouton :</label>
        <input type="text" id="thirdPlanningId" placeholder="Ex : 440474">
    </div>

    <div id="thirdButtonTimeSelection" class="form-group" style="display:none;">
        <label for="thirdButtonTime">Heure exacte pour le troisième bouton (HH:MM:SS) :</label>
        <input type="time" id="thirdButtonTime" step="1">
    </div>

    <button id="generateCodeBtn">Générer le code</button>

    <div class="form-group">
        <label for="generatedCode">Code généré ici:</label>
        <textarea id="generatedCode" readonly></textarea>
    </div>

    <button id="copyCodeBtn">Copier</button>
</div>

<script>
    const actionType = document.getElementById('actionType');
    const firstButton = document.getElementById('firstButton');
    const secondButton = document.getElementById('secondButton');
    const thirdButton = document.getElementById('thirdButton');

    const secondButtonSelection = document.getElementById('secondButtonSelection');
    const secondButtonTimeSelection = document.getElementById('secondButtonTimeSelection');
    const thirdButtonSelection = document.getElementById('thirdButtonSelection');
    const thirdButtonTimeSelection = document.getElementById('thirdButtonTimeSelection');

    const generateCodeBtn = document.getElementById('generateCodeBtn');
    const generatedCode = document.getElementById('generatedCode');
    const copyCodeBtn = document.getElementById('copyCodeBtn');

    const firstPlanningIdGroup = document.getElementById('firstPlanningIdGroup');
    const secondPlanningIdGroup = document.getElementById('secondPlanningIdGroup');
    const thirdPlanningIdGroup = document.getElementById('thirdPlanningIdGroup');

    function updatePlanningIdVisibility() {
        if (firstButton.value === 'playreelbutton') {
            firstPlanningIdGroup.style.display = 'block';
        } else {
            firstPlanningIdGroup.style.display = 'none';
        }

        if (secondButton.value === 'playreelbutton') {
            secondPlanningIdGroup.style.display = 'block';
        } else {
            secondPlanningIdGroup.style.display = 'none';
        }

        if (thirdButton.value === 'playreelbutton') {
            thirdPlanningIdGroup.style.display = 'block';
        } else {
            thirdPlanningIdGroup.style.display = 'none';
        }
    }

    actionType.addEventListener('change', function() {
        const action = this.value;

        if (action === 'simple') {
            secondButtonSelection.style.display = 'none';
            secondButtonTimeSelection.style.display = 'none';
            thirdButtonSelection.style.display = 'none';
            thirdButtonTimeSelection.style.display = 'none';
        } else if (action === 'double') {
            secondButtonSelection.style.display = 'block';
            secondButtonTimeSelection.style.display = 'block';
            thirdButtonSelection.style.display = 'none';
            thirdButtonTimeSelection.style.display = 'none';
        } else if (action === 'triple') {
            secondButtonSelection.style.display = 'block';
            secondButtonTimeSelection.style.display = 'block';
            thirdButtonSelection.style.display = 'block';
            thirdButtonTimeSelection.style.display = 'block';
        }

        updatePlanningIdVisibility();
    });

    firstButton.addEventListener('change', updatePlanningIdVisibility);
    secondButton.addEventListener('change', updatePlanningIdVisibility);
    thirdButton.addEventListener('change', updatePlanningIdVisibility);

    generateCodeBtn.addEventListener('click', function() {
        const action = actionType.value;

        const firstButtonId = firstButton.value;
        const firstButtonTimeVal = document.getElementById('firstButtonTime').value;
        const firstPlanningId = document.getElementById('firstPlanningId').value;

        const secondButtonId = document.getElementById('secondButton').value;
        const secondButtonTimeVal = document.getElementById('secondButtonTime').value;
        const secondPlanningId = document.getElementById('secondPlanningId').value;

        const thirdButtonId = document.getElementById('thirdButton').value;
        const thirdButtonTimeVal = document.getElementById('thirdButtonTime').value;
        const thirdPlanningId = document.getElementById('thirdPlanningId').value;

        if (!firstButtonTimeVal) {
            alert("Veuillez saisir l'heure du premier bouton.");
            return;
        }

        if ((action === 'double' || action === 'triple') && !secondButtonTimeVal) {
            alert("Veuillez saisir l'heure du deuxième bouton.");
            return;
        }

        if (action === 'triple' && !thirdButtonTimeVal) {
            alert("Veuillez saisir l'heure du troisième bouton.");
            return;
        }

        if (firstButtonId === 'playreelbutton' && !firstPlanningId) {
            alert("Veuillez saisir l'ID de la tâche (planning-id) pour le premier bouton Play.");
            return;
        }
        if ((action === 'double' || action === 'triple') && secondButtonId === 'playreelbutton' && !secondPlanningId) {
            alert("Veuillez saisir l'ID de la tâche (planning-id) pour le deuxième bouton Play.");
            return;
        }
        if (action === 'triple' && thirdButtonId === 'playreelbutton' && !thirdPlanningId) {
            alert("Veuillez saisir l'ID de la tâche (planning-id) pour le troisième bouton Play.");
            return;
        }

        let code = '';

        // -------- Premier bouton --------
        code += `var firstButtonTime = new Date();\n`;
        code += `firstButtonTime.setHours(... "${firstButtonTimeVal}".split(':'));\n`;
        code += `setTimeout(function() {\n`;

        if (firstButtonId === 'playreelbutton') {
            const sel = `li.planning-item[data-planning-id="${firstPlanningId}"] .playreelbutton`;
            code += `    var firstButton = document.querySelector('${sel}');\n`;
            code += `    if (firstButton) {\n`;
            code += `        firstButton.click();\n`;
            code += `        console.log("Premier bouton Play cliqué (planning-id ${firstPlanningId})");\n`;
            code += `    } else {\n`;
            code += `        console.log("Premier bouton Play introuvable (planning-id ${firstPlanningId})");\n`;
            code += `    }\n`;
        } else {
            code += `    var firstButton = document.getElementById("${firstButtonId}");\n`;
            code += `    if (firstButton) {\n`;
            code += `        firstButton.click();\n`;
            code += `        console.log("Premier bouton cliqué (#${firstButtonId})");\n`;
            code += `    } else {\n`;
            code += `        console.log("Premier bouton introuvable (#${firstButtonId})");\n`;
            code += `    }\n`;
        }

        code += `}, firstButtonTime.getTime() - new Date().getTime());\n\n`;

        // -------- Deuxième bouton --------
        if (action === 'double' || action === 'triple') {
            code += `var secondButtonTime = new Date();\n`;
            code += `secondButtonTime.setHours(... "${secondButtonTimeVal}".split(':'));\n`;
            code += `setTimeout(function() {\n`;

            if (secondButtonId === 'playreelbutton') {
                const sel2 = `li.planning-item[data-planning-id="${secondPlanningId}"] .playreelbutton`;
                code += `    var secondButton = document.querySelector('${sel2}');\n`;
                code += `    if (secondButton) {\n`;
                code += `        secondButton.click();\n`;
                code += `        console.log("Deuxième bouton Play cliqué (planning-id ${secondPlanningId})");\n`;
                code += `    } else {\n`;
                code += `        console.log("Deuxième bouton Play introuvable (planning-id ${secondPlanningId})");\n`;
                code += `    }\n`;
            } else {
                code += `    var secondButton = document.getElementById("${secondButtonId}");\n`;
                code += `    if (secondButton) {\n`;
                code += `        secondButton.click();\n`;
                code += `        console.log("Deuxième bouton cliqué (#${secondButtonId})");\n`;
                code += `    } else {\n`;
                code += `        console.log("Deuxième bouton introuvable (#${secondButtonId})");\n`;
                code += `    }\n`;
            }

            code += `}, secondButtonTime.getTime() - new Date().getTime());\n\n`;
        }

        // -------- Troisième bouton --------
        if (action === 'triple') {
            code += `var thirdButtonTime = new Date();\n`;
            code += `thirdButtonTime.setHours(... "${thirdButtonTimeVal}".split(':'));\n`;
            code += `setTimeout(function() {\n`;

            if (thirdButtonId === 'playreelbutton') {
                const sel3 = `li.planning-item[data-planning-id="${thirdPlanningId}"] .playreelbutton`;
                code += `    var thirdButton = document.querySelector('${sel3}');\n`;
                code += `    if (thirdButton) {\n`;
                code += `        thirdButton.click();\n`;
                code += `        console.log("Troisième bouton Play cliqué (planning-id ${thirdPlanningId})");\n`;
                code += `    } else {\n`;
                code += `        console.log("Troisième bouton Play introuvable (planning-id ${thirdPlanningId})");\n`;
                code += `    }\n`;
            } else {
                code += `    var thirdButton = document.getElementById("${thirdButtonId}");\n`;
                code += `    if (thirdButton) {\n`;
                code += `        thirdButton.click();\n`;
                code += `        console.log("Troisième bouton cliqué (#${thirdButtonId})");\n`;
                code += `    } else {\n`;
                code += `        console.log("Troisième bouton introuvable (#${thirdButtonId})");\n`;
                code += `    }\n`;
            }

            code += `}, thirdButtonTime.getTime() - new Date().getTime());\n\n`;
        }

        generatedCode.value = code;
    });

    copyCodeBtn.addEventListener('click', function() {
        generatedCode.select();
        document.execCommand('copy');
        alert('Cliqueo le OK pour confirmer le copie!');
    });
</script>

<!-- ===================================================== -->
<!-- 2. PROGRAMMATION EXTINCTION PC                        -->
<!-- ===================================================== -->
<div class="container">
    <h2>Programmer l'extinction du PC</h2>

    <div class="form-group">
        <label for="shutdownTime">Heure exacte pour l'extinction (HH:MM:SS) :</label>
        <input type="time" id="shutdownTime" step="1">
    </div>

    <button id="generateShutdownCodeBtn">Générer le code d'extinction</button>

    <div class="form-group">
        <label for="shutdownCode">Code généré :</label>
        <textarea id="shutdownCode" readonly></textarea>
    </div>

    <button id="copyShutdownCodeBtn">Copier le code d'extinction</button>
</div>

<script>
    const generateShutdownCodeBtn = document.getElementById('generateShutdownCodeBtn');
    const shutdownCode = document.getElementById('shutdownCode');
    const shutdownTimeInput = document.getElementById('shutdownTime');
    const copyShutdownCodeBtn = document.getElementById('copyShutdownCodeBtn');
    
    generateShutdownCodeBtn.addEventListener('click', function() {
        const now = new Date();
        const shutdownTime = shutdownTimeInput.value;

        if (!shutdownTime) {
            alert("Veuillez entrer une heure pour l'extinction.");
            return;
        }

        const timeParts = shutdownTime.split(':');
        const shutdownDate = new Date();
        shutdownDate.setHours(timeParts[0]);
        shutdownDate.setMinutes(timeParts[1]);
        shutdownDate.setSeconds(timeParts[2]);

        const timeDifference = shutdownDate.getTime() - now.getTime();

        if (timeDifference <= 0) {
            alert("L'heure d'extinction doit être après l'heure actuelle.");
            return;
        }

        const totalSeconds = Math.floor(timeDifference / 1000);
        const shutdownCommand = `shutdown -s -t ${totalSeconds}`;
        shutdownCode.value = shutdownCommand;
    });

    copyShutdownCodeBtn.addEventListener('click', function() {
        shutdownCode.select();
        document.execCommand('copy');
        alert('Le code d\'extinction a été copié dans le presse-papiers.');
    });
</script>

</body>
</html>
